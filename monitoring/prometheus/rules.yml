# Alerts on the routing service. They show on Prometheus's Alerts page
# (http://127.0.0.1:9090/alerts); no Alertmanager, which keeps the setup small.
groups:
  - name: pitwall
    rules:
      - alert: PitwallDown
        expr: up{job="pitwall"} == 0
        for: 1m
        annotations:
          summary: Pitwall's routing service is not answering
          description: Gearbox falls back to M while it is down, so answers continue but cost more.

      # The same limit the promotion rule uses (config.yaml: promotion.p95_ms_limit).
      - alert: PitwallSlowRouting
        expr: histogram_quantile(0.95, sum by (le) (rate(pitwall_route_latency_seconds_bucket[5m]))) > 0.6
        for: 10m
        annotations:
          summary: Routing p95 above 600 ms for 10 minutes
          description: Longer prompts than the model was measured on, or the CPU is busy.

      - alert: PitwallFailSafes
        expr: >
          sum(rate(pitwall_route_requests_total{fallback="true"}[10m]))
          / sum(rate(pitwall_route_requests_total[10m])) > 0.05
        for: 10m
        annotations:
          summary: Over 5% of decisions fell back to M
          description: The model gave none of S, M, L as its next token; check the served version.

      - alert: PitwallErrors
        expr: sum(rate(pitwall_route_errors_total[5m])) > 0
        for: 5m
        annotations:
          summary: Pitwall is answering requests with errors
          description: No model for the requested alias, or Ollama is down (see the reason label).

      # Written by `pitwall drift check` (M9), exposed by the service from its database.
      - alert: PitwallDrift
        expr: pitwall_drift_detected == 1
        annotations:
          summary: Recent prompts no longer look like the production model's training data
          description: >
            The latest drift check found {{ $value }} (see pitwall_drift_feature for which
            features). Retrain on newer data: `pitwall retrain`.

  - name: gearbox
    rules:
      - alert: GearboxDown
        expr: up{job="gearbox"} == 0
        for: 1m
        annotations:
          summary: Gearbox is not answering
          description: Clients get no answers while it is down.

      - alert: GearboxErrors
        expr: >
          sum(rate(gearbox_requests_total{status="error"}[10m]))
          / sum(rate(gearbox_requests_total[10m])) > 0.05
        for: 10m
        annotations:
          summary: Over 5% of Gearbox requests failed
          description: Every allowed tier failed for these requests; check the model providers and Ollama.

      - alert: GearboxBudget
        expr: gearbox_month_spend_gbp / gearbox_monthly_budget_gbp > 0.8
        annotations:
          summary: Gearbox has spent over 80% of this month's budget
          description: At 100% Gearbox sends every request to the free local tier until the month ends.
