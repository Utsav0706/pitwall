# Prometheus for a local run (scripts/monitoring.py): scrape Pitwall on this machine.
# monitoring/docker-compose.yml uses prometheus.compose.yml (the same, by service name).
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - rules.yml

scrape_configs:
  - job_name: pitwall
    metrics_path: /metrics/
    static_configs:
      - targets: ["127.0.0.1:8003"]
