# Prometheus in monitoring/docker-compose.yml: scrape the pitwall service by name.
# A local run uses prometheus.yml (the same, on 127.0.0.1).
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - rules.yml

scrape_configs:
  - job_name: pitwall
    metrics_path: /metrics/
    static_configs:
      - targets: ["pitwall:8003"]

  # Gearbox runs outside this file (its own repository); reached on the host.
  - job_name: gearbox
    metrics_path: /metrics/
    static_configs:
      - targets: ["host.docker.internal:8002"]
