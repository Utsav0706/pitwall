# Pitwall's service with Prometheus and Grafana, provisioned from this folder.
#   docker compose -f monitoring/docker-compose.yml up --build
# Prometheus http://localhost:9090, Grafana http://localhost:3000 (read-only, anonymous).
# CI starts it to prove the configuration works; on Windows without Docker, use
# scripts/monitoring.py instead. Ollama and MLflow are outside this file: /metrics
# works without them (requests then answer 503, which the error panels show).
services:
  pitwall:
    build: ..
    ports: ["8003:8003"]
    environment:
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      MLFLOW_TRACKING_URI: http://host.docker.internal:5000
    extra_hosts: ["host.docker.internal:host-gateway"]

  prometheus:
    image: prom/prometheus:v3.15.1
    ports: ["9090:9090"]
    command: ["--config.file=/etc/prometheus/prometheus.compose.yml"]
    volumes:
      - ./prometheus:/etc/prometheus:ro
    depends_on: [pitwall]

  grafana:
    image: grafana/grafana:13.3.0
    ports: ["3000:3000"]
    environment:
      PROMETHEUS_URL: http://prometheus:9090
      DASHBOARDS_DIR: /var/lib/grafana/dashboards
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on: [prometheus]
