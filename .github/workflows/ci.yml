name: CI

on:
  push:
    branches: [main]
  pull_request:
  # By hand too (Actions tab), e.g. when GitHub misses a push event.
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -e ".[dev]"

      - name: CLI starts
        run: |
          pitwall version
          pitwall doctor

      - name: Lint
        run: |
          ruff check .
          ruff format --check .

      - name: Test
        run: pytest

  # Anyone can rebuild the exact training data: fetch Gearbox's files from the pinned
  # commit, rebuild, and fail if any hash differs from the committed dvc.lock.
  data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -e . "dvc>=3.50"

      - name: Fetch Gearbox's files (pinned commit)
        # No DVC remote: `dvc pull` can't fetch imports from their source, `dvc update` can.
        run: dvc update -R data/gearbox

      - name: Rebuild and compare
        run: |
          dvc repro
          dvc status
          git diff --exit-code
          pitwall data show

  # The service image builds and starts its CLI (no Docker on the dev machine, so CI is
  # where the image is proven).
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: docker build -t pitwall:ci .
      - name: CLI inside the image
        run: |
          docker run --rm pitwall:ci pitwall version
          docker run --rm pitwall:ci python -c "import mlflow, pitwall.serving.app"

  # Monitoring as code works: promtool accepts the config and alert rules, and the
  # Compose stack starts with Prometheus scraping Pitwall and Grafana showing the
  # dashboard (no Docker on the dev machine, so this is where it is proven).
  monitoring:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: promtool check
        run: |
          docker run --rm -v "$PWD/monitoring/prometheus:/p:ro" --entrypoint promtool \
            prom/prometheus:v3.15.1 check config /p/prometheus.compose.yml
          docker run --rm -v "$PWD/monitoring/prometheus:/p:ro" --entrypoint promtool \
            prom/prometheus:v3.15.1 check rules /p/rules.yml
      - name: Start the stack
        run: docker compose -f monitoring/docker-compose.yml up -d --build
      - name: Prometheus scrapes Pitwall; Grafana has the dashboard
        run: |
          for i in $(seq 1 30); do
            state=$(curl -s localhost:9090/api/v1/targets \
              | python3 -c "import json,sys; t=[x for x in json.load(sys.stdin)['data']['activeTargets'] if x['labels']['job']=='pitwall']; print(t[0]['health'] if t else 'none')" || echo starting)
            [ "$state" = "up" ] && break
            sleep 5
          done
          echo "pitwall target: $state"; [ "$state" = "up" ]
          rules=$(curl -s localhost:9090/api/v1/rules | python3 -c "import json,sys; print(sum(len(g['rules']) for g in json.load(sys.stdin)['data']['groups']))")
          echo "alert rules loaded: $rules"; [ "$rules" = "8" ]
          for i in $(seq 1 20); do
            title=$(curl -s localhost:3000/api/dashboards/uid/pitwall | python3 -c "import json,sys; print(json.load(sys.stdin)['dashboard']['title'])" 2>/dev/null) && break
            sleep 3
          done
          echo "grafana dashboard: $title"; [ "$title" = "Pitwall router" ]
      - name: Logs on failure
        if: failure()
        run: docker compose -f monitoring/docker-compose.yml logs --tail 50
