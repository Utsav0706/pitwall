name: CI

on:
  push:
    branches: [main]
  pull_request:
  # By hand too (Actions tab), e.g. when GitHub misses a push event.
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -e ".[dev]"

      - name: CLI starts
        run: |
          pitwall version
          pitwall doctor

      - name: Lint
        run: |
          ruff check .
          ruff format --check .

      - name: Test
        run: pytest

  # Anyone can rebuild the exact training data: fetch Gearbox's files from the pinned
  # commit, rebuild, and fail if any hash differs from the committed dvc.lock.
  data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -e . "dvc>=3.50"

      - name: Fetch Gearbox's files (pinned commit)
        # No DVC remote: `dvc pull` can't fetch imports from their source, `dvc update` can.
        run: dvc update -R data/gearbox

      - name: Rebuild and compare
        run: |
          dvc repro
          dvc status
          git diff --exit-code
          pitwall data show
